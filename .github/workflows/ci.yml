name: CI/CD to VPS with Docker Swarm

on:
  push:
    branches:
      - quinche

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest

    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}

    steps:
      # 1️⃣ Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4️⃣ Ejecutar tests
      - name: Run tests
        run: npm test

      # 5️⃣ Build de la app (si aplica)
      - name: Build app
        run: npm run build --if-present

      # 6️⃣ Login en GitHub Container Registry
      - name: Login to GHCR
        run: echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u adqvelez-cloud --password-stdin

      # 7️⃣ Construir imagen Docker
      - name: Docker Build
        run: |
          docker build -t quinche:1.0.5 .

      # 8️⃣ Tag y Push al GHCR
      - name: Tag & Push Image to GHCR
        run: |
           IMAGE="ghcr.io/adqvelez-cloud/velez-alexis-examen"
           docker tag quinche:1.0.5 $IMAGE:1.0.5
           docker tag quinche:1.0.5 $IMAGE:latest

           docker push $IMAGE:1.0.5
           docker push $IMAGE:latest
      # 8.1️⃣ Verificar push (debug)
      - name: Verify Docker Push
        run: |
          echo "🔍 Verificando imágenes locales:"
          docker images | grep velez-alexis-examen
    
          echo "🔍 Verificando autenticación:"
          docker logout ghcr.io
          echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u adqvelez-cloud --password-stdin
    
          echo "🔍 Re-intentando push:"
          docker push ghcr.io/adqvelez-cloud/velez-alexis-examen:latest

      # 9️⃣ Copiar stack.yml al VPS
      - name: Copiar stack.yml al VPS (SCP)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ env.VPS_USER }}/deploy"

      # 9.1️⃣ Verificar que stack.yml se copió correctamente
      - name: Verificar copia de stack.yml en VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_SSH_PORT }}
          script: |
            if [ -f ~/deploy/stack.yml ]; then
              echo "✅ stack.yml copiado correctamente"
            else
              echo "❌ Error: stack.yml no encontrado en ~/deploy/"
              exit 1
            fi

      # 🔟 Deploy en el VPS via SSH
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_SSH_PORT }}
          script: |
            echo "🚀 Iniciando despliegue en VPS"

            cd ~/deploy

            # Login al GHCR desde el VPS
            echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u adqvelez-cloud --password-stdin

            # Descargar la última imagen
            docker pull ghcr.io/adqvelez-cloud/velez-alexis-examen:latest

            # Eliminar stack anterior (si existe)
            docker stack rm quinche || true

            # Esperar que el stack se libere
            sleep 10

            # Desplegar el nuevo stack limpio
            docker stack deploy --with-registry-auth -c stack.yml quinche

            # Mostrar estado final
            docker service ls
            docker stack ps quinche
